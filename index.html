<!DOCTYPE html>
<html lang="en">
<head> 
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Stardew Valley</title>
	<link rel="icon" href="data:," />
	<style>
		*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
		html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
		#loading {
			position: absolute; inset: 0;
			display: flex; align-items: center; justify-content: center;
			color: #fff; font: 1.5rem/1.3 sans-serif;
			z-index: 1;
			flex-direction: column; gap: 1rem;
			text-align: center;
		}
		#loading.hidden { display: none; }
		#music-choice {
			display: flex; flex-direction: column; align-items: center; gap: 0.75rem;
		}
		#music-choice button {
			font: 1.1rem/1 sans-serif; padding: 0.6rem 1.5rem;
			border: 2px solid #fff; border-radius: 6px;
			background: transparent; color: #fff; cursor: pointer;
			min-width: 260px; transition: background 0.15s;
		}
		#music-choice button:hover { background: rgba(255,255,255,0.15); }
		#music-choice .hint { font-size: 0.85rem; opacity: 0.6; }
		#status {
			display: flex; flex-direction: column; align-items: center; gap: 0.6rem;
			min-width: min(90vw, 420px);
		}
		#status[hidden], #error[hidden], #music-choice[hidden] { display: none; }
		#status-text { font-size: 1.1rem; }
		#bar {
			width: 100%; height: 8px; border-radius: 4px;
			background: rgba(255,255,255,0.15); overflow: hidden;
		}
		#bar-fill {
			width: 0%; height: 100%; border-radius: 4px;
			background: #fff; transition: width 0.2s linear;
		}
		#bar-fill.indeterminate {
			width: 40% !important; transition: none;
			animation: slide 1.1s ease-in-out infinite;
		}
		@keyframes slide {
			0% { transform: translateX(-100%); }
			100% { transform: translateX(250%); }
		}
		@media (prefers-reduced-motion: reduce) {
			#bar-fill.indeterminate { animation: none; width: 100% !important; }
		}
		#status-detail { font-size: 0.85rem; opacity: 0.65; min-height: 1.1em; }
		#error {
			display: flex; flex-direction: column; align-items: center; gap: 0.75rem;
			max-width: min(92vw, 640px); padding: 1.5rem;
			border: 1px solid rgba(255,255,255,0.25); border-radius: 10px;
			background: rgba(255,255,255,0.05);
		}
		#error .error-title { font-size: 1.2rem; font-weight: 600; }
		#error .error-detail {
			font: 0.9rem/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
			opacity: 0.75; word-break: break-word; white-space: pre-wrap;
		}
		#error button {
			font: 1rem/1 sans-serif; padding: 0.55rem 1.4rem;
			border: 2px solid #fff; border-radius: 6px;
			background: transparent; color: #fff; cursor: pointer;
		}
		#error button:hover { background: rgba(255,255,255,0.15); }
		canvas {
			width: 100%; height: 100%; display: block;
		}
	</style>
</head>
<body>
	<div id="loading">
		<div id="music-choice">
			<div>Download options</div>
			<button id="btn-no-music">Play without music <span class="hint">(~64 MB)</span></button>
			<button id="btn-with-music">Play with music <span class="hint">(~540 MB)</span></button>
		</div>
		<div id="status" hidden>
			<div id="status-text">Starting...</div>
			<div id="bar"><div id="bar-fill"></div></div>
			<div id="status-detail"></div>
		</div>
		<div id="error" hidden></div>
	</div>
	<canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
	<script type="module" src="game.js?v=2"></script>
</body>
</html>
